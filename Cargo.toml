[workspace]
resolver = "2"
members = [
    "crates/sysml-core",
    "crates/sysml-ir",
    "crates/sysml-macros",
    "crates/sysml-dsl",
    "crates/sysml-std",
    "crates/sysml-emit",
    "crates/sysml-lift",
    "crates/sysml-cli",
    "crates/sysml-sim",
    "examples/apollo11_model",
    "examples/apollo11_sim",
    "examples/embedded_flight_controller",
    "examples/starter_model",
    "examples/solar_system",
    "examples/earth_water_cycle",
    "examples/bicycle",
    "examples/power_tools_family",
    "examples/dishwasher",
    "examples/microwave",
    "examples/microwave_sim",
]
exclude = [
    "third_party/open-mbee/crates/sysmlv2-syntax",
    "third_party/open-mbee/crates/sysmlv2-model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoavbendor/rsysdsl"

[workspace.dependencies]
sysml-core = { path = "crates/sysml-core" }
sysml-ir = { path = "crates/sysml-ir" }
sysml-macros = { path = "crates/sysml-macros" }
sysml-dsl = { path = "crates/sysml-dsl" }
sysml-std = { path = "crates/sysml-std" }
sysml-emit = { path = "crates/sysml-emit" }
sysml-lift = { path = "crates/sysml-lift" }
sysml-sim = { path = "crates/sysml-sim" }
apollo11-model = { path = "examples/apollo11_model" }
apollo11-sim = { path = "examples/apollo11_sim" }
embedded-flight-controller = { path = "examples/embedded_flight_controller" }
microwave = { path = "examples/microwave" }
microwave-sim = { path = "examples/microwave_sim" }

# Primary SysML v2 parser & validation oracle (vendored from Open-MBEE/sysml-toolkit rev c8d256b
# so Cargo never downloads the 2.1 GB upstream SysML-v2-Release git submodule)
sysmlv2-syntax = { path = "third_party/open-mbee/crates/sysmlv2-syntax", features = ["serde"] }
sysmlv2-model = { path = "third_party/open-mbee/crates/sysmlv2-model" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
clap = { version = "4", features = ["derive"] }
trybuild = "1"
tempfile = "3"
