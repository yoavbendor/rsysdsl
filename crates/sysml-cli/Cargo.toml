[package]
name = "sysml-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent-first CLI for bidirectional Rust <-> SysML v2 emission, lifting, round-trip checks, auditing, and executable verification"

[[bin]]
name = "rsysdsl"
path = "src/main.rs"

[dependencies]
sysml-ir = { workspace = true }
sysml-emit = { workspace = true }
sysml-lift = { workspace = true }
sysml-std = { workspace = true }
apollo11-model = { workspace = true }
apollo11-sim = { workspace = true }
sysml-sim = { workspace = true }
embedded-flight-controller = { workspace = true }
microwave = { workspace = true }
microwave-sim = { workspace = true }
dishwasher = { workspace = true }
dishwasher-sim = { workspace = true }
power-tools-family = { workspace = true }
power-tools-family-sim = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
