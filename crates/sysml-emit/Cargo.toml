[package]
name = "sysml-emit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic 1:1 SysML v2 textual emitter and Open-MBEE sysml-toolkit validation bridge"

[features]
default = ["validate"]
validate = ["dep:sysmlv2-syntax", "dep:sysmlv2-model"]

[dependencies]
sysml-ir = { workspace = true }
serde = { workspace = true }
sysmlv2-syntax = { workspace = true, optional = true }
sysmlv2-model = { workspace = true, optional = true }
