[package]
name = "sysml-emit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic 1:1 SysML v2 textual emitter, Open-MBEE validator with OMG stdlib, traceability audit, and ASPICE matrix generator"

[features]
default = ["validate", "viewer"]
validate = ["dep:sysmlv2-syntax", "dep:sysmlv2-model"]
viewer = []

[dependencies]
sysml-core = { workspace = true }
sysml-ir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysmlv2-syntax = { workspace = true, optional = true }
sysmlv2-model = { workspace = true, optional = true }
