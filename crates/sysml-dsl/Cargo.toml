[package]
name = "sysml-dsl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ergonomic #![no_std]-capable facade re-exporting sysml-core, optional sysml-ir reflection, and sysml-macros"

[features]
default = ["reflect"]
reflect = ["dep:sysml-ir"]

[dependencies]
sysml-core = { workspace = true }
sysml-ir = { workspace = true, optional = true }
sysml-macros = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
